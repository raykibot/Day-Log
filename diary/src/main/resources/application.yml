spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: diary
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/diary?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 201MB

mybatis:
  mapper-locations: classpath:mapper/*.xml

server:
  address: 127.0.0.1
  port: 9292

diary:
  upload-dir: ${UPLOAD_DIR:./uploads}
